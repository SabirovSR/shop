{% extends 'base.html' %}
{% load static %}

{% block title %}Добавить автора - PlayTrade{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 50px auto;">
    <div class="glass-card p-6">
        <h1 class="title-gold text-center mb-6">✍️ Добавить автора</h1>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name" class="text-white mb-2 d-block">Имя автора</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Введите имя автора" required>
            </div>
            
            <div class="form-group">
                <label for="email" class="text-white mb-2 d-block">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="author@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="bio" class="text-white mb-2 d-block">Биография</label>
                <textarea id="bio" name="bio" class="form-control" rows="4" placeholder="Расскажите об авторе..." required></textarea>
            </div>
            
            <div class="form-group">
                <label for="birth_date" class="text-white mb-2 d-block">Дата рождения</label>
                <input type="date" id="birth_date" name="birth_date" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-success btn-block btn-lg mt-4">
                ✅ Добавить автора
            </button>
        </form>
        
        <div class="text-center mt-4">
            <a href="/" class="btn btn-outline-light">← Вернуться на главную</a>
        </div>
    </div>
</div>
{% endblock %}
