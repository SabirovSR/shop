{% extends 'base.html' %}
{% load static %}

{% block title %}Добавить разработчика - PlayTrade{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 50px auto;">
    <div class="glass-card p-6">
        <h1 class="title-gold text-center mb-6">🏢 Добавить разработчика</h1>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name" class="text-white mb-2 d-block">Название компании</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Введите название разработчика" required>
            </div>
            
            <div class="form-group">
                <label for="email" class="text-white mb-2 d-block">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="contact@company.com" required>
            </div>
            
            <div class="form-group">
                <label for="bio" class="text-white mb-2 d-block">Описание</label>
                <textarea id="bio" name="bio" class="form-control" rows="4" placeholder="Расскажите о компании-разработчике..." required></textarea>
            </div>
            
            <div class="form-group">
                <label for="founded_date" class="text-white mb-2 d-block">Дата основания</label>
                <input type="date" id="founded_date" name="founded_date" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-success btn-block btn-lg mt-4">
                ✅ Добавить разработчика
            </button>
        </form>
        
        <div class="text-center mt-4">
            <a href="{% url 'catalog' %}" class="btn btn-outline-light">← Вернуться к каталогу</a>
        </div>
    </div>
</div>
{% endblock %}
