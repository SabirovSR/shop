{% extends 'base.html' %}
{% load static %}

{% block title %}Добавить книгу - PlayTrade{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 50px auto;">
    <div class="glass-card p-6">
        <h1 class="title-gold text-center mb-6">📚 Добавить книгу</h1>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="title" class="text-white mb-2 d-block">Название книги</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="Введите название книги" required>
            </div>
            
            <div class="form-group">
                <label for="author" class="text-white mb-2 d-block">Автор</label>
                <select id="author" name="author" class="form-control" required>
                    <option value="">Выберите автора</option>
                    {% for author in authors %}
                        <option value="{{ author.id }}">{{ author.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="category" class="text-white mb-2 d-block">Категория</label>
                <select id="category" name="category" class="form-control">
                    <option value="">Выберите категорию</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="published_date" class="text-white mb-2 d-block">Дата публикации</label>
                <input type="date" id="published_date" name="published_date" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="price" class="text-white mb-2 d-block">Цена (₽)</label>
                <input type="number" id="price" name="price" step="0.01" class="form-control" placeholder="0.00" required>
            </div>
            
            <div class="form-group d-flex align-center gap-2 mt-4">
                <input type="checkbox" id="in_stock" name="in_stock" checked style="width: 20px; height: 20px;">
                <label for="in_stock" class="text-white mb-0">В наличии</label>
            </div>
            
            <button type="submit" class="btn btn-success btn-block btn-lg mt-4">
                ✅ Добавить книгу
            </button>
        </form>
        
        <div class="text-center mt-4">
            <a href="/" class="btn btn-outline-light">← Вернуться на главную</a>
        </div>
    </div>
</div>
{% endblock %}
